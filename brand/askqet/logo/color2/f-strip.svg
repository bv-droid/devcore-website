<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 192" fill="none">
  <title>AskQet</title>
  <rect width="340" height="192" fill="#F9F3ED"/>
  <text x="18" y="26" font-family="ui-monospace,monospace" font-size="8" letter-spacing="1.2" fill="#366DBE">НАЛОГИ · УПРОЩЁНКА</text><text x="18" y="46" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" font-weight="600" fill="#514F4A">Форма 910.00</text><rect x="18" y="58" width="304" height="1" fill="#D2D0CA"/><text x="18" y="76" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9.5" fill="#514F4A">Индивидуальный предприниматель на упрощённом режиме сдаёт</text><text x="18" y="90" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9.5" fill="#514F4A">форму 910.00 дважды в год: до 15 августа и до 15 февраля.</text><text x="18" y="104" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9.5" fill="#514F4A">Предельный доход за полугодие — 24 038 МРП. При превышении</text><text x="18" y="118" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9.5" fill="#514F4A">режим слетает на общеустановленный со следующего квартала.</text><text x="18" y="132" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9.5" fill="#366DBE">Сроки и штрафы за просрочку →</text><rect x="18" y="143" width="2" height="34" fill="#366DBE"/><text x="28" y="152" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9" fill="#84817C">МРП на 2026 год — 4 325 тенге. Предел</text><text x="28" y="165" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9" fill="#84817C">полугодия считается по нему, а не по МЗП.</text>

</svg>

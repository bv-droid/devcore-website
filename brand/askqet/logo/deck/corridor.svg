<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 216" fill="none">
  <title>Коридор печати</title>
  <rect x="70" y="52" width="600" height="40" fill="currentColor" opacity="0.07"/>
  <rect x="70" y="52" width="40" height="40" rx="2" fill="rgb(111,111,111)"/>
  <rect x="256.667" y="52" width="40" height="40" rx="2" fill="rgb(94,94,94)"/>
  <rect x="443.333" y="52" width="40" height="40" rx="2" fill="rgb(71,71,71)"/>
  <rect x="630" y="52" width="40" height="40" rx="2" fill="rgb(34,34,34)"/>
  <text x="692" y="80.8" fill="currentColor" font-size="26">4</text>
  <text x="718" y="80.8" fill="currentColor" font-size="14" opacity="0.7">ступени</text>
  <text x="70" y="41" fill="currentColor" font-size="13" opacity="0.65">если бы чёрный был разрешён</text>
  <rect x="70" y="140" width="600" height="40" fill="currentColor" opacity="0.07"/>
  <rect x="70" y="140" width="40" height="40" rx="2" fill="rgb(111,111,111)"/>
  <rect x="630" y="140" width="40" height="40" rx="2" fill="rgb(84,84,84)"/>
  <text x="692" y="168.8" fill="currentColor" font-size="26">2</text>
  <text x="718" y="168.8" fill="currentColor" font-size="14" opacity="0.7">ступени</text>
  <text x="70" y="129" fill="currentColor" font-size="13" opacity="0.65">как есть: чёрного нет</text>
  <text x="70" y="206" fill="currentColor" font-size="12" opacity="0.6">сверху коридор зажат требованием AA, снизу — запретом на чёрный</text>

</svg>
